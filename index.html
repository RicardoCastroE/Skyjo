<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyjo Score Tracker</title>
    <link rel="stylesheet" href="style.css">
    <div class="version-badge">v2.2.0</div>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎲 Skyjo Score Tracker 🎲</h1>
            <p>First to 100 loses!</p>
        </div>

        <div id="gameOverMessage" class="game-over hidden">
            <h2 id="gameOverText"></h2>
            <p>Game Over - Click Reset to start a new game</p>
        </div>

        <div class="controls-container">
            <button class="reset-btn">
                <span style="font-size: 1.3rem;">↻</span>
                Reset Game
            </button>
            <button class="add-player-btn">
                <span style="font-size: 1.3rem;">+</span>
                Add Player
            </button>
        </div>

        <div class="players-grid" id="playersGrid"></div>
    </div>

    <div class="modal" id="addPlayerModal">
        <div class="modal-content">
            <h3>Add New Player</h3>
            <input 
                type="text" 
                id="newPlayerNameInput" 
                placeholder="Enter player name"
            >
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelAddPlayerBtn">Cancel</button>
                <button class="modal-btn confirm" id="confirmAddPlayerBtn">Add</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
